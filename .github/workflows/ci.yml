name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      # ruff pinned: unpinned, this job picked up a ruff release mid-audit (2026-09-22)
      # that added a new lint rule and failed CI again the same day it had just been
      # fixed. mypy/pytest/pip-audit stay unpinned on purpose — mypy is `|| true`
      # below, and pytest/pip-audit *should* run against their latest release (a new
      # test-runner incompatibility or a freshly published CVE are both genuinely
      # worth knowing about immediately, unlike a linter's opinion changing).
      # pytest-timeout was missing here even though the Test step below has always
      # passed --timeout=30 — pytest rejects an unrecognized CLI flag outright, so
      # this step could never have passed, independent of anything else (2026-09-22).
      - run: pip install ruff==0.16.8 mypy pytest pytest-timeout pip-audit
      - name: Lint
        run: ruff check backend/ --output-format=github
      - name: Type check
        run: mypy backend/ --ignore-missing-imports || true
      - name: Dependency vulnerability scan
        # Hard gate: 0 known vulnerabilities confirmed as of this workflow's
        # introduction, so any new finding here is a real regression to
        # triage, not noise to silence with `|| true`.
        run: pip-audit -r requirements.txt
      - name: Test
        run: python -m pytest tests/ -x -q --timeout=30
        env:
          GROQ_API_KEY: test-key
          AI_PROVIDER: mistral

  # Sanity-checks that `npm run build` still succeeds. NOT used for
  # deployment — production Nginx serves frontend/index.html, admin.html
  # and frontend/src/*.js|.css directly as static files (see the Nginx
  # config in GUIDE.md), not a Vite-bundled frontend/dist/. There is no
  # bare-specifier import anywhere in frontend/src/app.js, so the raw
  # source works unbundled; this job exists only to catch syntax errors
  # before they'd otherwise go unnoticed.
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Only the directories the app actually needs — never the repo
          # root ("."), which would also ship tests/, docs, and .github/.
          # .env, outputs/, jobs/, logs/ and venv/ are runtime state or
          # secrets and are gitignored, so they're never in this checkout
          # to begin with; scp-action doesn't delete files that aren't in
          # the source, so they're untouched on the server either way.
          source: "backend/,frontend/,alembic/,alembic.ini,requirements.txt"
          target: "/var/www/ai-publish-engine/"
          strip_components: 0
      - name: Install deps, run migrations, restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/ai-publish-engine
            source venv/bin/activate
            pip install -r requirements.txt -q
            # alembic upgrade head runs automatically inside the app on
            # startup (backend/core/database.py) — no separate migration
            # step needed here. It is a no-op against the existing
            # production schema unless a new migration was added.
            pm2 restart ai-publish-engine
            sleep 5
            curl -sf http://127.0.0.1:9109/api/health || (echo "Health check failed after deploy" && exit 1)
            pm2 status
