upstream ai_publish_backend {
    server 127.0.0.1:9109;
    keepalive 64;
}
server {
    listen 80;
    server_name ai-publish.hardbanrecordslab.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name ai-publish.hardbanrecordslab.online;
    ssl_certificate /etc/letsencrypt/live/ai-publish.hardbanrecordslab.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-publish.hardbanrecordslab.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 100M;
    location /favicon.ico {
        alias /var/www/ai-publish-engine/frontend/favicon.svg;
    }
    location /api/ {
        proxy_pass http://ai_publish_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /frontend/ {
        alias /var/www/ai-publish-engine/frontend/;
        try_files $uri $uri/ =404;
    }
    location /outputs/ {
        alias /var/www/ai-publish-engine/outputs/;
        internal;
    }
    location / {
        root /var/www/ai-publish-engine/frontend;
        try_files $uri $uri/ /index.html;
    }
    access_log /var/log/nginx/ai-publish-access.log;
    error_log /var/log/nginx/ai-publish-error.log;
}
