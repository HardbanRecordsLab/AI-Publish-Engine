# Local development only.
#
# Production does NOT use this file — the live app runs via PM2 + a venv
# directly on the VPS (see GUIDE.md), against a PostgreSQL instance shared
# with other unrelated services on that box (different DB name/user than
# the defaults below). This compose file's only job is to give a developer
# a disposable local Postgres to point their own .env's DATABASE_URL at,
# e.g. DATABASE_URL=postgresql://aipublish:changeme@localhost:5432/aipublish
#
# There used to be an `app` service here too (`build: .`), but no
# Dockerfile has ever existed in this repo — that service could never
# have started. Removed rather than leaving a config that silently fails.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: aipublish-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aipublish
      POSTGRES_USER: aipublish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipublish -d aipublish"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
