[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "PL"]
ignore = [
    "PLR0913",  # too-many-arguments
    "PLR2004",  # magic-value-comparison
    # 2026-09-22: `ruff check backend/` had been failing CI on every push since before
    # this repo's history here (327 violations on main, none from any change that
    # introduced them incrementally — the PL ruleset was evidently turned on without
    # ever being fit to the existing code). Audited every category found and split
    # them: genuine issues were fixed directly (unused imports, import sorting,
    # a couple of narrow one-off exceptions get an inline `# noqa` with a reason).
    # The four below are pervasive, deliberate patterns here, not bugs — enforcing
    # them would mean either a large, high-risk mechanical rewrite across 50+ files
    # (E501) or restructuring working business logic with no behavioural benefit
    # (the rest). Ignored at the config level so CI is a real, followable gate for
    # new code again instead of permanently red.
    "E501",     # line-too-long — codebase predates the 120-col limit throughout; see above
    "PLC0415",  # import-outside-top-level — lazy imports are used deliberately here to
                # dodge circular imports and defer heavy/startup-only deps (see the
                # `_queue_job` docstring in routers/jobs.py for one documented case)
    "PLW0603",  # global-statement — standard module-level singleton/cache pattern
                # (_pool, _series_cache, _last_fetch, _main_loop)
    "PLR0915",  # too-many-statements — a handful of large, central functions
                # (the ebook builder, KDP export, the job worker); splitting them for
                # a statement-count threshold isn't a change to make without deep
                # domain context and real test coverage of the split
    "PLR0912",  # too-many-branches — same functions, same reasoning
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913", "PLR2004", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
