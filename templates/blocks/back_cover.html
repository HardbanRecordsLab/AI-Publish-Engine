<section class="back-cover page" style="
  page: back-cover;
  display: flex; flex-direction: column; justify-content: center;
  align-items: center; height: 100vh; text-align: center;
  background: var(--cover-gradient); position: relative;
">
  <div style="max-width: 12cm; padding: 2cm;">
    <div style="font-size: 24px; margin-bottom: 0.5cm; opacity: 0.8;">{{ icon }}</div>
    <p style="font-size: 11pt; color: var(--color-muted); line-height: 1.7; margin-bottom: 0.5cm;">{{ blurb }}</p>
    <div style="width: 40px; height: 2px; background: var(--color-accent); margin: 0 auto 0.5cm;"></div>
    <p style="font-size: 9pt; color: var(--color-muted); letter-spacing: 1px;">{{ author }} · {{ tagline }}</p>
    <p style="font-size: 8pt; color: var(--color-muted); margin-top: 1cm; opacity: 0.5;">Generated by AI Publishing Engine</p>
  </div>
</section>
