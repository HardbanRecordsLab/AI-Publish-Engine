<section class="copyright page" style="page: copyright; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center;">
  <div style="max-width: 10cm;">
    <p style="font-size: 9pt; color: var(--color-muted); margin-bottom: 0.5cm; line-height: 1.6;">
      <strong style="color: var(--color-heading);">{{ title }}</strong><br>
      {{ subtitle }}
    </p>
    <p style="font-size: 8pt; color: var(--color-muted); line-height: 1.6;">
      Published by AI Design Engine<br>
      {{ date }}
    </p>
    <div style="width: 40px; height: 1px; background: var(--color-border); margin: 0.5cm auto;"></div>
    <p style="font-size: 8pt; color: var(--color-muted); line-height: 1.6;">
      All rights reserved. No part of this publication may be reproduced, distributed, or transmitted in any form or by any means without prior written permission.
    </p>
    <p style="font-size: 8pt; color: var(--color-muted); margin-top: 0.5cm; line-height: 1.6;">
      Generated by <strong>AI Publishing Engine</strong>
    </p>
  </div>
</section>
