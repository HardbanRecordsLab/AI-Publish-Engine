<section class="glossary page">
  <div style="max-width: var(--content-width); margin: 0 auto; padding-top: 1cm;">
    <h2 style="font-family: var(--font-heading); font-size: var(--font-size-h2); color: var(--color-heading); margin-bottom: 0.5cm; font-weight: 700;">Glossary</h2>
    {% if terms %}
    <dl>
      {% for term in terms %}
      <div style="margin-bottom: 0.3cm; padding-bottom: 0.2cm; border-bottom: 1px solid var(--color-border);">
        <dt style="font-weight: 600; font-size: 10pt; color: var(--color-heading);">{{ term.term }}</dt>
        <dd style="font-size: 9pt; color: var(--color-text); margin-top: 0.05cm; line-height: 1.5;">{{ term.definition }}</dd>
      </div>
      {% endfor %}
    </dl>
    {% endif %}
  </div>
</section>
