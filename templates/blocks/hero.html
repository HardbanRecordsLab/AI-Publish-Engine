<div class="hero" style="margin-bottom: 0.6cm; padding: 0.6cm 0.5cm; background: var(--cover-gradient); border-radius: var(--radius-lg); text-align: center; color: #fff;">
  {% if icon %}<div style="margin-bottom: 0.3cm; opacity: 0.8;">{{ icon }}</div>{% endif %}
  <h2 style="font-family: var(--font-heading); font-size: 20pt; font-weight: 700; margin-bottom: 0.2cm;">{{ title }}</h2>
  {% if subtitle %}<p style="font-size: 11pt; opacity: 0.85;">{{ subtitle }}</p>{% endif %}
</div>
