<div class="infographic-block" style="margin: 0.6cm 0; padding: 0.4cm; background: var(--color-secondary); border-radius: var(--radius-lg); text-align: center; page-break-inside: avoid;">
  {% if title %}<div class="ig-title" style="font-size: 9pt; font-weight: 600; color: var(--color-accent); margin-bottom: 0.25cm; text-transform: uppercase; letter-spacing: 1.5px;">{{ title }}</div>{% endif %}
  {% if description %}<div class="ig-desc" style="font-size: 8.5pt; color: var(--color-muted); margin-bottom: 0.3cm;">{{ description }}</div>{% endif %}
  {{ svg }}
</div>
