<blockquote style="margin: 0.5cm 0; padding: 0.3cm 0.5cm; border-left: 3px solid var(--color-accent); background: var(--color-surface); border-radius: 0 var(--radius-md) var(--radius-md) 0; page-break-inside: avoid;">
  <p style="font-size: 11pt; font-style: italic; line-height: 1.6; color: var(--color-text);">“{{ text }}”</p>
  {% if author %}<cite style="display: block; margin-top: 0.2cm; font-size: 9pt; color: var(--color-muted);">— {{ author }}</cite>{% endif %}
</blockquote>
