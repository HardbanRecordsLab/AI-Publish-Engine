<section class="references page">
  <div style="max-width: var(--content-width); margin: 0 auto; padding-top: 1cm;">
    <h2 style="font-family: var(--font-heading); font-size: var(--font-size-h2); color: var(--color-heading); margin-bottom: 0.5cm; font-weight: 700;">{{ title }}</h2>
    {% if items %}
    <ul style="list-style: none; padding: 0;">
      {% for item in items %}
      <li style="padding: 0.15cm 0; font-size: 9pt; color: var(--color-text); line-height: 1.5; border-bottom: 1px solid var(--color-border);">{{ item }}</li>
      {% endfor %}
    </ul>
    {% else %}
    <p style="font-size: 10pt; color: var(--color-muted); font-style: italic;">{{ content }}</p>
    {% endif %}
  </div>
</section>
