<div class="section" style="margin-bottom: var(--spacing-lg);">
  {% if heading %}<h3 style="font-family: var(--font-heading); font-size: var(--font-size-h3); color: var(--color-heading); margin-bottom: var(--spacing-sm); font-weight: 600;">{{ heading }}</h3>{% endif %}
  {% if content %}<p style="margin-bottom: var(--spacing-sm); text-align: justify;">{{ content }}</p>{% endif %}
</div>
