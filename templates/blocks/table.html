<div style="margin: 0.5cm 0; overflow-x: auto; page-break-inside: avoid;">
  {% if caption %}<p style="font-size: 9pt; font-weight: 600; color: var(--color-muted); margin-bottom: 0.2cm;">{{ caption }}</p>{% endif %}
  <table style="width: 100%; border-collapse: collapse; font-size: 9.5pt;">
    {% if headers %}
    <thead>
      <tr style="background: var(--color-secondary);">
        {% for h in headers %}<th style="padding: 0.2cm 0.3cm; text-align: left; font-weight: 600; color: var(--color-heading); border-bottom: 2px solid var(--color-accent);">{{ h }}</th>{% endfor %}
      </tr>
    </thead>
    {% endif %}
    <tbody>
      {% for row in rows %}
      <tr style="{% if loop.index is odd %}background: var(--color-highlight);{% endif %}">
        {% for cell in row %}<td style="padding: 0.15cm 0.3cm; border-bottom: 1px solid var(--color-border);">{{ cell }}</td>{% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
