<section class="title-page page" style="page: front; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 6in; text-align: center;">
  <h1 style="font-family: var(--font-heading); font-size: 24pt; color: var(--color-heading); line-height: 1.2; margin-bottom: 0.4cm;">{{ title }}</h1>
  {% if subtitle %}<p style="font-size: 12pt; color: var(--color-muted); font-style: italic; text-indent: 0; text-align: center;">{{ subtitle }}</p>{% endif %}
  {% if author %}<p style="font-size: 13pt; margin-top: 2cm; letter-spacing: 1px; text-indent: 0; text-align: center;">{{ author }}</p>{% endif %}
</section>
