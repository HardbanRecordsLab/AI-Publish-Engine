<section class="toc page" style="page: toc;">
  <h2 style="font-family: var(--font-heading); font-size: var(--font-size-h2); color: var(--color-heading); margin-bottom: 0.6cm; padding-bottom: 0.3cm; border-bottom: 1px solid var(--color-border);">Contents</h2>
  <ol style="list-style: none;">
    {% for item in items %}
    <li style="display: flex; align-items: baseline; padding: 0.2cm 0; border-bottom: 1px dotted var(--color-border);">
      <span style="font-weight: 600; color: var(--color-accent); width: 1cm; font-size: 10pt;">{{ item.number }}</span>
      <span style="flex: 1; font-size: 10.5pt;">{{ item.title }}</span>
      <span style="flex: 1; border-bottom: 1px dotted var(--color-border); margin: 0 0.3cm; min-width: 1cm;"></span>
      {% if item.page %}<span style="color: var(--color-muted); font-size: 9pt;">{{ item.page }}</span>{% endif %}
    </li>
    {% endfor %}
  </ol>
</section>
